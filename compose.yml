name: ollama-remote-server

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [ollama-net]

  model-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${MODEL_NAME:-hadad/qwen3-4bd:Q8_0}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [ollama-net]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      NGINX_ENVSUBST_FILTER: ^API_KEY$
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      model-pull:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks: [ollama-net]

networks:
  ollama-net:
    driver: bridge

volumes:
  ollama-data:

